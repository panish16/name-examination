name: NAME-EXAMINATION UI CI

on:
  pull_request:
    types: [assigned, synchronize]
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  nameexamination-ci:
    uses: panish16/bcregistry-sre/.github/workflows/frontend-ci.yaml@feat/upgrade-pnpm-v11
    with:
      node_version: '24'
      pnpm_version: '10.28.1'
      app_name: "nameexamination"
      working_directory: "./app"
      codecov_flag: ""
